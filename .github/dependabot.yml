version: 2
# Minor and patch updates arrive as one grouped PR per ecosystem; each major update keeps its own PR,
# because majors are the ones that can break the build.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Spring Boot majors need a planned migration (odd/tasks/spring-boot-upgrade.md), not a weekly PR.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
