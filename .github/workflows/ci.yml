name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job needs to write to the repository.
permissions:
  contents: read

# A new push to the same PR cancels its stale run. Pushes to main get a per-run group, so a
# newer push can never cancel or supersede (even while queued) an earlier main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + Phase A Testcontainers E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker preinstalled — no extra setup needed for
      # Testcontainers (research.md). SaleFlowE2ETest pins the docker-java
      # api.version workaround itself for the known Docker-29.x
      # incompatibility (testcontainers/testcontainers-java#11212); this job
      # is what confirms whether that same workaround is still needed here.
      - run: mvn -B clean test
      # cancelled() covers the job hitting timeout-minutes, which is not a failure().
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
          if-no-files-found: ignore

  frontend-unit:
    name: Frontend (lint + Vitest unit tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      # Vite build errors (broken imports, bad syntax in unused paths) are not caught by Vitest.
      - working-directory: frontend
        run: npm run build

  architecture-doc:
    name: Architecture doc (generator tests + up-to-date check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The generated sections of docs/architecture.md are derived from the code;
      # this fails when a change alters them without re-running the script.
      - run: node --test scripts/architecture-doc.test.mjs
      - run: node scripts/architecture-doc.mjs --check

  e2e-full-stack:
    name: Full-stack E2E (Playwright, Phase B)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        # NUBEFACT_API_TOKEN is optional (see frontend/e2e/README.md) — the
        # suite asserts the chosen voucher type round-trips correctly, not
        # that NubeFacT itself accepts the document, so it's meaningful
        # either way. Set the repo secret to also exercise a real sandbox
        # acceptance path.
        env:
          NUBEFACT_API_TOKEN: ${{ secrets.NUBEFACT_API_TOKEN }}
        run: npm run test:e2e
      # cancelled() covers the job hitting timeout-minutes, which is not a failure().
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
