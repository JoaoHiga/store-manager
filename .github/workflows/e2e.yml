name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (unit + Phase A Testcontainers E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker preinstalled — no extra setup needed for
      # Testcontainers (research.md). SaleFlowE2ETest pins the docker-java
      # api.version workaround itself for the known Docker-29.x
      # incompatibility (testcontainers/testcontainers-java#11212); this job
      # is what confirms whether that same workaround is still needed here.
      - run: mvn -B clean test

  frontend-unit:
    name: Frontend (Vitest unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test

  architecture-doc:
    name: Architecture doc (generator tests + up-to-date check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The generated sections of docs/architecture.md are derived from the code;
      # this fails when a change alters them without re-running the script.
      - run: node --test scripts/architecture-doc.test.mjs
      - run: node scripts/architecture-doc.mjs --check

  e2e-full-stack:
    name: Full-stack E2E (Playwright, Phase B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        # NUBEFACT_API_TOKEN is optional (see frontend/e2e/README.md) — the
        # suite asserts the chosen voucher type round-trips correctly, not
        # that NubeFacT itself accepts the document, so it's meaningful
        # either way. Set the repo secret to also exercise a real sandbox
        # acceptance path.
        env:
          NUBEFACT_API_TOKEN: ${{ secrets.NUBEFACT_API_TOKEN }}
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
