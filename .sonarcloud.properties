# SonarQube Cloud automatic analysis settings (read from the default branch only).
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis

# Each JPA entity deliberately mirrors the fields of its domain twin: the domain stays free of JPA
# (hexagonal architecture). Copy-paste detection reports those pairs as duplication, so the
# persistence entities are excluded from it. They are still analyzed for bugs and code smells.
sonar.cpd.exclusions=**/infrastructure/persistence/**/*JpaEntity.java
