spring:
  application:
    name: store-manager
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:store_manager}
    username: ${DB_USER:store_manager}
    password: ${DB_PASSWORD:store_manager}
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, never by Hibernate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

# NubeFacT credentials (design.md: read from the environment, never committed). Both have
# sensible defaults so the app still boots without real sandbox credentials configured.
nubefact:
  base-url: ${NUBEFACT_BASE_URL:https://api.nubefact.com}
  token: ${NUBEFACT_API_TOKEN:}
